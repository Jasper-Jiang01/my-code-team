[project]
name = "codepilot"
version = "0.1.0"
description = "Multi-Agent Dynamic Workflow System based on LangGraph + LangChain"
requires-python = ">=3.12"
dependencies = [
    "langgraph==1.2.11",
    "langgraph-api==0.13.2",
    "langchain==1.3.18",
    "langchain-openai==1.6.0",
    "langchain-anthropic==1.7.0",
    "langsmith==0.11.2",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.3",
    "httpx==0.28.1",
    "sqlalchemy==2.0.52",
    "psycopg2-binary==2.9.12",
    "pyyaml==6.0.3",
    "pillow==12.3.0",
    "langgraph-checkpoint-sqlite==3.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "langgraph-cli[inmem]>=0.2.0",
]
# 注意：dev 依赖保留范围版本以便开发时获取最新补丁
vector = [
    "chromadb>=0.5.0",
]
postgres = [
    "langgraph-checkpoint-postgres>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codepilot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
extraPaths = ["src"]


[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
